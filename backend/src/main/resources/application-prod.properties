# ===================================================================
# Production Profile Configuration (PostgreSQL + Live Mail)
# Activate with: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ===================================================================
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 in production
spring.h2.console.enabled=false

# Live Email Delivery Configuration
taskpulse.mail.simulation-mode=${TASKPULSE_MAIL_SIMULATION_MODE:false}
taskpulse.mail.from-address=${TASKPULSE_MAIL_FROM_ADDRESS:notifications@taskpulse.com}
taskpulse.mail.from-name=${TASKPULSE_MAIL_FROM_NAME:TaskPulse Team}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

