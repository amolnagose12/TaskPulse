# ===================================================================
# TaskPulse Application Configuration
# ===================================================================
spring.application.name=taskpulse-backend
server.port=${PORT:8080}

# -------------------------------------------------------------------
# Database Configuration (Defaults to H2 in-memory, overridden by env vars)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console only if H2 is active
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Mail Configuration (Spring Mail)
# -------------------------------------------------------------------
taskpulse.mail.simulation-mode=${TASKPULSE_MAIL_SIMULATION_MODE:true}
taskpulse.mail.from-address=${TASKPULSE_MAIL_FROM_ADDRESS:notifications@taskpulse.internal}
taskpulse.mail.from-name=${TASKPULSE_MAIL_FROM_NAME:TaskPulse Team Notifier}

# Real SMTP Settings (Overridden via environment variables in production)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# -------------------------------------------------------------------
# Task Scheduling
# -------------------------------------------------------------------
# Run deadline reminder checks daily at 09:00 AM
taskpulse.scheduling.deadline-cron=0 0 9 * * *

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.taskpulse=INFO
logging.level.org.springframework.web=INFO

